<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Dirección 2 · Foco total</title>
<style>
  :root {
    --canvas:#0d0e0f; --s1:#141617; --s2:#1a1d1f; --s3:#212527;
    --hairline:rgba(255,255,255,0.075); --hairline-2:rgba(255,255,255,0.12);
    --t1:#f0f2f3; --t2:#a3abaf; --t3:#798184;
    --accent:#e0b155; --accent-dim:rgba(224,177,85,0.16);
    --danger:#e2836f; --danger-dim:rgba(226,131,111,0.09); --danger-line:rgba(226,131,111,0.35);
    --r-ctl:3px; --r-box:5px; --ease:cubic-bezier(0.2,0.8,0.25,1); --fast:140ms; --slow:260ms;
    --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--canvas); color:var(--t1); font:13px/1.5 var(--font-body); display:grid; place-items:center; padding:24px; }

  .wrap { width:min(380px, 100%); animation:rise var(--slow) var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .wrap { animation:none; } }

  .head { text-align:center; margin-bottom:26px; }
  .head .mark { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border:1px solid var(--hairline-2); border-radius:var(--r-box); color:var(--accent); margin-bottom:14px; background:var(--s1); }
  .head .mark svg { width:22px; height:22px; }
  .head h1 { font-size:20px; font-weight:600; letter-spacing:-0.01em; }
  .head p { color:var(--t2); margin-top:4px; }

  .fgroup { margin-top:16px; text-align:left; }
  .flabel { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .flabel label { font-size:12px; font-weight:500; color:var(--t2); }
  .field {
    width:100%; height:34px; padding:0 11px; border:1px solid var(--hairline-2); border-radius:var(--r-ctl);
    background:var(--s1); color:var(--t1); font:13px var(--font-body);
    transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }
  .field::placeholder { color:var(--t2); }
  .field:hover { border-color:rgba(255,255,255,0.18); }
  .field:focus { outline:none; border-color:var(--accent); background:var(--s1); box-shadow:0 0 0 3px var(--accent-dim); }
  .pwrap { position:relative; }
  .pwrap .field { padding-right:40px; }
  .ojo {
    position:absolute; right:3px; top:3px; width:28px; height:28px;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:var(--r-ctl); background:transparent; color:var(--t2); cursor:pointer;
    transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .ojo:hover { background:var(--s3); color:var(--t1); }
  .ojo[aria-pressed="true"] { color:var(--accent); }
  .ojo svg { width:16px; height:16px; }
  .err { display:block; color:var(--danger); font-size:12px; margin-top:5px; }

  .submit {
    margin-top:22px; width:100%; height:38px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); border:1px solid var(--accent); border-radius:var(--r-ctl);
    color:#17140c; font:600 13px var(--font-body); cursor:pointer; position:relative; overflow:hidden;
    transition:background var(--fast) var(--ease), transform var(--fast) var(--ease);
  }
  .submit::after {
    content:""; position:absolute; inset:0; background:var(--accent-dim); opacity:0;
    transition:opacity var(--fast) var(--ease);
  }
  .submit:hover { background:#eec06a; }
  .submit:active { transform:scale(0.99); }

  .divider { display:flex; align-items:center; gap:12px; margin:20px 0 0; color:var(--t3); font-size:11px; }
  .divider::before, .divider::after { content:""; height:1px; background:var(--hairline); flex:1; }

  .foot { margin-top:14px; text-align:center; font-size:12.5px; color:var(--t2); }
  .foot a { color:var(--t1); font-weight:500; text-decoration:underline; text-decoration-color:var(--hairline-2); text-underline-offset:3px; transition:text-decoration-color var(--fast) var(--ease); }
  .foot a:hover { text-decoration-color:var(--accent); }

  .hint { margin-top:22px; text-align:center; color:var(--t3); font-size:11.5px; }

  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 5.5V10l3 2"/></svg>
      </div>
      <h1>Follow-Up</h1>
      <p>Tus tareas y tu semana, bajo control</p>
    </header>

    <form aria-label="Formulario de inicio de sesión">
      <div class="fgroup">
        <div class="flabel">
          <label for="login-email">Correo electronico</label>
          <span class="err" id="email-err">Ingresa un correo valido</span>
        </div>
        <input id="login-email" class="field" type="email" placeholder="usuario@gmail.com" autocomplete="email" aria-describedby="email-err">
      </div>

      <div class="fgroup">
        <div class="flabel"><label for="login-pass">Contraseña</label></div>
        <div class="pwrap">
          <input id="login-pass" class="field" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password">
          <button type="button" class="ojo" aria-label="Ocultar contraseña" aria-pressed="true">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l14 14"/><path d="M10 5c4.5 0 8 5 8 5a13.6 13.6 0 0 1-2.2 2.6M6.6 6.6A13 13 0 0 0 2 10s3.5 5 8 5c1.2 0 2.3-.3 3.3-.8"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit">Iniciar sesion</button>
    </form>

    <div class="divider" aria-hidden="true">sigue tu semana</div>

    <p class="foot">¿No tienes cuenta? <a href="#">Registrate</a></p>
    <p class="hint">El recordatorio de tu semana te espera en el tablero.</p>
  </main>
</body>
</html>
