<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Dirección 3 · Mesa de trabajo</title>
<style>
  :root {
    --canvas:#0d0e0f; --s1:#141617; --s2:#1a1d1f; --s3:#212527;
    --hairline:rgba(255,255,255,0.075); --hairline-2:rgba(255,255,255,0.12);
    --t1:#f0f2f3; --t2:#a3abaf; --t3:#798184;
    --accent:#e0b155; --accent-dim:rgba(224,177,85,0.16);
    --ok:#9cc49c; --ok-dim:rgba(156,196,156,0.12);
    --danger:#e2836f; --danger-dim:rgba(226,131,111,0.09); --danger-line:rgba(226,131,111,0.35);
    --r-ctl:3px; --r-box:5px; --ease:cubic-bezier(0.2,0.8,0.25,1); --fast:140ms; --slow:260ms;
    --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  /* La mesa: el canvas con una retícula de hairlines apenas visible. */
  body {
    background:
      linear-gradient(var(--hairline) 1px, transparent 1px) 0 -1px / 100% 56px,
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px) -1px 0 / 56px 100%,
      var(--canvas);
    color:var(--t1); font:13px/1.5 var(--font-body);
    display:flex; flex-direction:column; padding:28px 40px;
  }

  .top { display:flex; align-items:center; gap:10px; }
  .top svg { width:20px; height:20px; color:var(--accent); }
  .top b { font-size:14px; font-weight:600; letter-spacing:-0.01em; }
  .top span { color:var(--t3); font-size:12px; margin-left:auto; }

  .mid { flex:1; display:grid; place-items:center; }

  .desk {
    width:420px; background:var(--s1); border:1px solid var(--hairline); border-radius:var(--r-box);
    box-shadow:0 18px 44px rgba(0,0,0,0.35); /* una sola sombra funcional: separa la hoja de la mesa */
    padding:30px 32px 26px;
    animation:lay var(--slow) var(--ease) both;
  }
  @keyframes lay { from { opacity:0; transform:translateY(12px) scale(0.995); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .desk { animation:none; } }

  .desk h1 { font-size:18px; font-weight:600; display:inline; letter-spacing:-0.01em; }
  .underline {
    display:block; height:2px; width:44px; background:var(--accent); margin:8px 0 2px; border-radius:1px;
    transform-origin:left; animation:grow 420ms var(--ease) 120ms both;
  }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .underline { animation:none; } }
  .desk .sub { color:var(--t2); margin-top:6px; }

  .fgroup { margin-top:18px; }
  .fgroup label { display:block; font-size:12px; font-weight:500; color:var(--t2); margin-bottom:6px; }
  .field {
    width:100%; height:34px; padding:0 10px; border:1px solid var(--hairline-2); border-radius:var(--r-ctl);
    background:var(--canvas); color:var(--t1); font:13px var(--font-body);
    transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .field::placeholder { color:var(--t2); }
  .field:hover { border-color:rgba(255,255,255,0.18); }
  .field:focus { outline:none; border-color:var(--accent); background:var(--s2); }
  .pwrap { position:relative; }
  .pwrap .field { padding-right:38px; }
  .ojo {
    position:absolute; right:3px; top:3px; width:28px; height:28px;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:var(--r-ctl); background:transparent; color:var(--t2); cursor:pointer;
    transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .ojo:hover { background:var(--s3); color:var(--t1); }
  .ojo svg { width:16px; height:16px; }

  .okbox {
    margin-top:14px; padding:9px 11px; background:var(--ok-dim); border:1px solid rgba(156,196,156,0.35);
    border-radius:var(--r-ctl); color:var(--ok); font-size:12px;
  }

  .submit {
    margin-top:20px; width:100%; height:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); border:1px solid var(--accent); border-radius:var(--r-ctl);
    color:#17140c; font:600 13px var(--font-body); cursor:pointer;
    transition:background var(--fast) var(--ease), transform var(--fast) var(--ease);
  }
  .submit:hover { background:#eec06a; }
  .submit:active { transform:scale(0.99); }

  .foot { margin-top:16px; text-align:center; color:var(--t2); font-size:12.5px; }
  .foot a { color:var(--t1); text-decoration:underline; text-decoration-color:var(--hairline-2); text-underline-offset:3px; transition:text-decoration-color var(--fast) var(--ease); }
  .foot a:hover { text-decoration-color:var(--accent); }

  .bottom {
    border-top:1px solid var(--hairline); padding-top:14px;
    display:flex; gap:20px; color:var(--t3); font-size:12px;
  }
  .bottom b { color:var(--t2); font-weight:500; }
  .bottom .clock { margin-left:auto; font:12px var(--font-mono); color:var(--t3); font-variant-numeric:tabular-nums; }

  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
  <header class="top">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 5.5V10l3 2"/></svg>
    <b>Follow-Up</b>
    <span> lunes 16 de noviembre</span>
  </header>

  <main class="mid">
    <section class="desk" aria-labelledby="auth-title">
      <h1 id="auth-title">Inicia sesion</h1>
      <span class="underline" aria-hidden="true"></span>
      <p class="sub">Tu mesa te espera igual que la dejaste.</p>

      <form aria-label="Formulario de inicio de sesión">
        <div class="fgroup">
          <label for="login-email">Correo electronico</label>
          <input id="login-email" class="field" type="email" placeholder="usuario@gmail.com" autocomplete="email">
        </div>

        <div class="fgroup">
          <label for="login-pass">Contraseña</label>
          <div class="pwrap">
            <input id="login-pass" class="field" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password">
            <button type="button" class="ojo" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 10s3.5-5 8-5 8 5 8 5-3.5 5-8 5-8-5-8-5z"/><circle cx="10" cy="10" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="okbox" role="status">Sesion cerrada correctamente. Nos vemos pronto.</div>

        <button type="submit" class="submit">Iniciar sesion</button>
      </form>

      <p class="foot">¿No tienes cuenta? <a href="#">Registrate</a></p>
    </section>
  </main>

  <footer class="bottom">
    <span><b>Biblioteca</b> · 12 documentos</span>
    <span><b>Calendario</b> · 3 eventos</span>
    <span><b>Notas</b> · 7 notas</span>
    <span class="clock">25:00 pomodoro</span>
  </footer>
</body>
</html>
