name: deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    name: deploy to the VPS
    runs-on: ubuntu-latest
    steps:
      - name: pull and rebuild over ssh
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Fail on the first failing command: without this a rejected fetch
            # still reports success and leaves the old containers running.
            set -e
            cd ${{ secrets.WORK_DIR }}
            git fetch --all
            git checkout ${{ secrets.PROD_BRANCH }}
            git pull --ff-only
            # The SPA is a git submodule; without this the frontend image builds
            # from an empty directory.
            git submodule update --init --recursive
            docker compose up -d --build
            docker image prune -f
